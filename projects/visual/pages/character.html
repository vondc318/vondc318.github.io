<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character</title>
    <link rel="stylesheet" href="../main.css" />
  </head>
  <body class="character-page">
    <main>
      <img
        class="character-page__image character-page__painting"
        src="../imgs/character-painting.jpg"
        alt="Colorful abstract painting"
      />
      <img
        class="character-page__image character-page__drawing"
        src="../imgs/character-drawing.png"
        alt="Hand-drawn figure"
      />
      <img
        class="character-page__image character-page__cartoon"
        src="../imgs/character-cartoon.png"
        alt="Black-and-white cartoon characters"
      />
      <img
        class="character-page__image character-page__emoji"
        src="../imgs/character-emoji.png"
        alt="Saluting yellow emoji"
      />
      <p class="character-page__message">Thank you for clicking on this page</p>
    </main>
  </body>
</html>
